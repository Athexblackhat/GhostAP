# ======================================================================
#  GhostAP — hostapd Configuration Template
#  Developer: ATHEX BLACK HAT
#  Version: 1.0.0
#  Description: Fake access point configuration
#  Placeholders: {{INTERFACE}} {{SSID}} {{CHANNEL}} {{DRIVER}} {{HW_MODE}}
# ======================================================================

# === INTERFACE ===
# monitor mode interface to broadcast on
interface={{INTERFACE}}

# === DRIVER ===
# nl80211 is the modern mac80211 driver — works with most chipsets
# fallback options: hostap (old), wired (for testing)
driver={{DRIVER}}

# === SSID ===
# spoofed network name — identical to target AP
ssid={{SSID}}

# === HARDWARE MODE ===
# g = 2.4 GHz (channels 1-14)
# a = 5 GHz (channels 36-165)
# n = 802.11n (2.4 GHz)
# ac = 802.11ac (5 GHz)
hw_mode={{HW_MODE}}

# === CHANNEL ===
# match the target AP's channel exactly
channel={{CHANNEL}}

# === MAC ADDRESS ACL ===
# 0 = accept all clients (default, no filtering)
# 1 = allow only listed MACs
# 2 = deny listed MACs
macaddr_acl=0

# === AUTHENTICATION ===
# 1 = open system (no encryption — easiest for captive portal)
# set to 0 for shared key auth
auth_algs=1

# === SSID BROADCAST ===
# 0 = broadcast SSID (visible in network list)
# 1 = hide SSID (victims must know exact name to connect)
ignore_broadcast_ssid=0

# === WMM / QoS ===
# 1 = enable WiFi Multimedia (improves compatibility)
# 0 = disable (may cause issues with some clients)
wmm_enabled=1

# === WPA SECURITY (OPTIONAL) ===
# uncomment and configure below to create a password-protected fake AP
# this makes the attack MORE convincing — victim sees "secured" network
# and enters password thinking it's their real AP

# wpa=2
# wpa_passphrase=GhostAP123
# wpa_key_mgmt=WPA-PSK
# wpa_pairwise=CCMP
# rsn_pairwise=CCMP

# === BEACON INTERVAL ===
# how often the AP announces itself (in millisecond units — 102.4 ms)
# 100 = ~102.4ms (default)
# lower = more frequent = faster discovery but more noise
beacon_int=100

# === DTIM PERIOD ===
# delivery traffic indication map — how often clients wake up
# 1 = every beacon (faster response, more battery drain on clients)
# 3 = every 3 beacons (default, balanced)
dtim_period=2

# === SUPPORTED RATES ===
# basic rates all clients must support (in 500 kbps units)
# these are standard 802.11g rates
supported_rates=60 90 120 180 240 360 480 540

# basic rates — clients MUST support at least these
basic_rates=60 120 240

# === MAX ASSOCIATIONS ===
# limit how many victims can connect simultaneously
# 0 = unlimited (default)
max_num_sta=50

# === FRAGMENTATION THRESHOLD ===
# 2346 = default (no fragmentation)
# lower values may help with packet injection in noisy environments
fragm_threshold=2346

# === RTS THRESHOLD ===
# request-to-send threshold
# 2347 = default (disabled)
# lower values can help with hidden node problems
rts_threshold=2347

# === LOGGING ===
# log level:
# 0 = verbose debugging
# 1 = debugging
# 2 = informational (default)
# 3 = notification
# 4 = warning
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# === IEEE 802.11N SUPPORT ===
# enable 802.11n (high throughput) for better compatibility
ieee80211n=1

# HT capabilities — 20 MHz channel width
ht_capab=[SHORT-GI-20][RX-STBC1]

# === IEEE 802.11AC SUPPORT ===
# enable 802.11ac if hardware mode supports it
# ieee80211ac=1
# vht_capab=[SHORT-GI-80][MAX-A-MPDU-LEN-EXP3]
# vht_oper_chwidth=0
# vht_oper_centr_freq_seg0_idx=0

# ======================================================================
#  END OF HOSTAPD TEMPLATE
# ======================================================================